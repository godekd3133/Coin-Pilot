<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CoinPilot">
    <meta name="description" content="코인·주식 자동매매와 기간별 포트폴리오의 자산, 손익, 엔진 상태를 한곳에서 확인하는 CoinPilot">
    <title>CoinPilot</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try {
            var savedTheme = localStorage.getItem('coinpilot.theme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
        } catch (e) { /* storage may be blocked */ }
    </script>
    <link rel="stylesheet" href="app/ui/tokens.css">
    <link rel="stylesheet" href="app/ui/base.css">
    <link rel="stylesheet" href="app/ui/components.css">
</head>
<body>
    <div id="cp-app" class="cp-shell" aria-busy="true">
        <noscript>CoinPilot을 사용하려면 JavaScript를 켜 주세요.</noscript>
    </div>
    <script src="socket.io/socket.io.js"></script>
    <script src="auth-client.js"></script>
    <script type="module" src="app/main.js"></script>
</body>
</html>
