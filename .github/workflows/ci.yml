name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, personal-mac]

    strategy:
      matrix:
        node-version: ['24.21.0', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check src/index.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  ios-simulator-build:
    runs-on: [self-hosted, personal-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Build server-data iOS app for Simulator
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/coinpilot-ios-server" \
            COINPILOT_DATA_MODE=server \
            CODE_SIGNING_ALLOWED=NO \
            build
          test ! -f "${RUNNER_TEMP}/coinpilot-ios-server/Build/Products/Debug-iphonesimulator/App.app/CoinPilotBundledPreview.json"

      - name: Build and verify bundled-preview profile
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/coinpilot-ios-preview" \
            COINPILOT_DATA_MODE=bundled-preview \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -f "${RUNNER_TEMP}/coinpilot-ios-preview/Build/Products/Debug-iphonesimulator/App.app/CoinPilotBundledPreview.json"
