		F7101A7B8C2D4E10A1B2C3D8 /* Conditional bundled market data */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(SRCROOT)/App/CoinPilotBundledPreview.json",
			);
			name = "Bundle selected market data only";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(DERIVED_FILE_DIR)/CoinPilotDataMode.txt",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -eu\nMODE=\"${COINPILOT_DATA_MODE:-server}\"\nPREVIEW_SOURCE=\"${SRCROOT}/App/CoinPilotBundledPreview.json\"\nAPP_RESOURCE_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nPREVIEW_TARGET=\"${APP_RESOURCE_DIR}/CoinPilotBundledPreview.json\"\nLOCAL_TARGET=\"${APP_RESOURCE_DIR}/CoinPilotBundledLocalMarketData.json\"\nLOCAL_DIGEST_TARGET=\"${APP_RESOURCE_DIR}/CoinPilotBundledLocalMarketData.sha256\"\nSECRETS_SOURCE=\"${COINPILOT_SECRETS_FILE:-}\"\nSECRETS_TARGET=\"${APP_RESOURCE_DIR}/CoinPilotLocalSecrets.json\"\nrm -f \"${PREVIEW_TARGET}\" \"${LOCAL_TARGET}\" \"${LOCAL_DIGEST_TARGET}\" \"${SECRETS_TARGET}\"\ncase \"${MODE}\" in\n  server)\n    ;;\n  bundled-preview)\n    mkdir -p \"${APP_RESOURCE_DIR}\"\n    cp \"${PREVIEW_SOURCE}\" \"${PREVIEW_TARGET}\"\n    ;;\n  bundled-local)\n    LOCAL_SOURCE=\"${COINPILOT_LOCAL_MARKET_DATA_FILE:-}\"\n    case \"${LOCAL_SOURCE}\" in\n      /*) ;;\n      *) echo \"error: COINPILOT_LOCAL_MARKET_DATA_FILE must be an explicit absolute file path.\" >&2; exit 1 ;;\n    esac\n    if [ ! -f \"${LOCAL_SOURCE}\" ]; then\n      echo \"error: COINPILOT_LOCAL_MARKET_DATA_FILE does not exist or is not a file.\" >&2\n      exit 1\n    fi\n    FILE_BYTES=$(/usr/bin/stat -f '%z' \"${LOCAL_SOURCE}\")\n    if [ \"${FILE_BYTES}\" -gt 52428800 ]; then\n      echo \"error: local market data exceeds the 50 MiB limit.\" >&2\n      exit 1\n    fi\n    python3 - \"${LOCAL_SOURCE}\" <<'PY'\nimport datetime, json, math, re, sys\n\ndef fail(message):\n    raise ValueError(message)\n\ndef unique_pairs(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result:\n            fail('duplicate JSON field: ' + key)\n        result[key] = value\n    return result\n\ndef reject_constant(value):\n    fail('non-JSON numeric constant: ' + value)\n\ndef exact_fields(value, keys, label):\n    if type(value) is not dict or set(value) != set(keys):\n        fail(label + ' fields do not match schema v1')\n\ndef utc_timestamp(value):\n    if type(value) is not str or not re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,9})?Z', value):\n        fail('timestamp must be an ISO-8601 UTC value ending in Z')\n    return datetime.datetime.fromisoformat(value[:-1] + '+00:00')\n\ndef finite_number(value):\n    return type(value) in (int, float) and math.isfinite(value)\n\ntry:\n    with open(sys.argv[1], 'r', encoding='utf-8') as source_file:\n        root = json.load(source_file, object_pairs_hook=unique_pairs, parse_constant=reject_constant)\n    exact_fields(root, {'schemaVersion', 'source', 'generatedAt', 'markets'}, 'root')\n    if type(root['schemaVersion']) is not int or root['schemaVersion'] != 1 or root['source'] != 'upbit-public-market-api':\n        fail('unsupported schema version or source')\n    generated_at = utc_timestamp(root['generatedAt'])\n    markets = root['markets']\n    if type(markets) is not list or not 1 <= len(markets) <= 500:\n        fail('market list must contain 1 to 500 markets')\n    seen_markets = set()\n    for market_row in markets:\n        exact_fields(market_row, {'market', 'candles'}, 'market')\n        market = market_row['market']\n        if type(market) is not str or not re.fullmatch(r'KRW-[A-Z0-9]{2,15}', market) or market in seen_markets:\n            fail('market must be a unique KRW code')\n        seen_markets.add(market)\n        candles = market_row['candles']\n        if type(candles) is not list or not 1 <= len(candles) <= 20000:\n            fail('each market must have 1 to 20000 candles')\n        previous = {}\n        seen_candles = set()\n        for candle in candles:\n            exact_fields(candle, {'intervalMinutes', 'timestamp', 'open', 'high', 'low', 'close', 'volume'}, 'candle')\n            interval = candle['intervalMinutes']\n            if type(interval) is not int or interval not in (1, 5, 15, 60):\n                fail('unsupported candle interval')\n            timestamp = utc_timestamp(candle['timestamp'])\n            if timestamp > generated_at:\n                fail('candle timestamp must not be later than generatedAt')\n            candle_key = (interval, candle['timestamp'])\n            if candle_key in seen_candles or (interval in previous and timestamp <= previous[interval]):\n                fail('candles must be unique and chronological per interval')\n            seen_candles.add(candle_key)\n            previous[interval] = timestamp\n            values = [candle[name] for name in ('open', 'high', 'low', 'close', 'volume')]\n            if not all(finite_number(value) for value in values):\n                fail('OHLCV values must be finite numbers')\n            opening, high, low, close, volume = values\n            if min(opening, high, low, close) <= 0 or volume < 0 or high < max(opening, close) or low > min(opening, close) or low > high:\n                fail('OHLCV values are outside valid bounds')\nexcept (OSError, UnicodeError, json.JSONDecodeError, ValueError, TypeError, KeyError) as error:\n    print('error: invalid bundled local market data: ' + str(error), file=sys.stderr)\n    sys.exit(1)\nPY\n    mkdir -p \"${APP_RESOURCE_DIR}\"\n    cp \"${LOCAL_SOURCE}\" \"${LOCAL_TARGET}\"\n    python3 - \"${LOCAL_TARGET}\" \"${LOCAL_DIGEST_TARGET}\" <<'PY'\nimport hashlib, pathlib, sys\npayload = pathlib.Path(sys.argv[1]).read_bytes()\npathlib.Path(sys.argv[2]).write_bytes(hashlib.sha256(payload).hexdigest().encode('ascii'))\nPY\n    ;;\n  *)\n    echo \"error: unsupported COINPILOT_DATA_MODE '${MODE}'.\" >&2\n    exit 1\n    ;;\nesac\nif [ \"${MODE}\" = \"server\" ] && [ -f \"${SECRETS_SOURCE}\" ]; then\n  mkdir -p \"${APP_RESOURCE_DIR}\"\n  cp \"${SECRETS_SOURCE}\" \"${SECRETS_TARGET}\"\nfi\nprintf '%s\\n' \"${MODE}\" > \"${DERIVED_FILE_DIR}/CoinPilotDataMode.txt\"\n";
		};
