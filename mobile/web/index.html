<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4ee">
    <meta name="color-scheme" content="light">
    <title>CoinPilot · 서버 연결</title>
    <link rel="stylesheet" href="styles.css">
    <script src="server-url.js" defer></script>
    <script src="auto-connect.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="screen">
      <header class="masthead"><span class="brand-name">CoinPilot</span></header>

      <section class="connection-card" aria-labelledby="title">
        <p class="section-label">서버 연결</p>
        <h1 id="title">서버 주소</h1>
        <p class="intro">계좌와 시세 정보는 지정한 서버에서 불러옵니다. 자동매매 엔진과 거래소 API 키도 서버에서 관리합니다.</p>

        <form id="server-form" novalidate>
          <label for="server-url">서버 주소</label>
          <div class="input-wrap">
            <span class="input-prefix" aria-hidden="true">↗</span>
            <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://coinpilot.example.com" required>
          </div>
          <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
          <button class="primary-button" type="submit">
            <span>저장하고 연결하기</span><span aria-hidden="true">→</span>
          </button>
        </form>

        <div id="saved-server" class="saved-server" hidden>
          <span class="saved-label">현재 서버</span>
          <strong id="saved-host"></strong>
        </div>

        <button id="forget-server" class="text-button" type="button" hidden>서버 연결 정보 삭제</button>
      </section>

      <details class="connection-help">
        <summary>다른 서버를 연결하려면</summary>
        <p>같은 Wi-Fi의 Mac 서버는 내부 주소로, 외부 서버는 HTTPS 주소로 연결해 주세요. 거래소 API 키는 이 앱에 입력하지 마세요.</p>
      </details>

      <footer class="footer-note">
        <p>자동매매 엔진과 거래소 API 키는 서버에서 관리합니다.</p>
      </footer>
    </main>
  </body>
</html>
