# /etc/nginx/conf.d/coinpilot-rate-limit.conf (http context)
# Per-client request budgets in front of both dashboards. The app keeps its
# own login lockout; this stops floods before they reach Node on a 412MB host.
limit_req_zone $binary_remote_addr zone=coinpilot_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=coinpilot_api:5m rate=20r/s;
limit_req_status 429;
