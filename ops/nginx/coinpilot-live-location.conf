# Include inside the existing HTTPS server block for 52.78.156.161.
# The existing root location continues to serve the Paper dashboard.
location = /live {
    return 308 /live/;
}

location = /live/api/auth/login {
    limit_req zone=coinpilot_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:3101/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /live/ {
    limit_req zone=coinpilot_api burst=100 nodelay;
    proxy_pass http://127.0.0.1:3101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
